<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <title>小组件 · API 监控</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
        "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background: #f4f6fb;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .widget {
      width: 100%; max-width: 360px;
      background: #fff; border-radius: 24px; padding: 18px 18px 14px;
      box-shadow: 0 10px 30px rgba(31, 41, 55, .12);
    }
    .w-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .w-logo {
      width: 30px; height: 30px; border-radius: 10px; flex: none;
      background: linear-gradient(135deg, #4f8cff, #21c8a8);
      box-shadow: inset 0 0 0 6px rgba(255,255,255,.92);
    }
    .w-title { font-size: 13px; font-weight: 700; color: #1f2937; flex: 1; }
    .w-time { font-size: 10px; color: #9ca3af; }
    .w-provider {
      display: inline-block; font-size: 12px; font-weight: 700; color: #2563eb;
      background: #eef4ff; border-radius: 8px; padding: 2px 8px; margin-bottom: 10px;
    }
    .w-model { font-size: 11px; color: #6b7280; margin-left: 6px; }
    .w-remaining { font-size: 34px; font-weight: 800; color: #0ea5e9; letter-spacing: -.5px; line-height: 1.15; }
    .w-remaining.low { color: #ef4444; }
    .w-remaining-label { font-size: 11px; color: #9ca3af; margin-bottom: 12px; }
    .w-rows { border-top: 1px solid #eef1f6; padding-top: 10px; }
    .w-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
    .w-row-label { font-size: 12px; color: #6b7280; }
    .w-row-value { font-size: 14px; font-weight: 700; color: #1f2937; }
    .w-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .w-note { font-size: 10px; color: #9ca3af; }
    .w-actions { display: flex; gap: 8px; }
    .w-btn {
      border: none; border-radius: 10px; padding: 7px 12px; font-size: 12px;
      font-weight: 600; cursor: pointer; background: #f1f5fb; color: #374151;
    }
    .w-btn.primary { background: #3b82f6; color: #fff; }
    .w-btn:disabled { opacity: .6; }
    .w-error { font-size: 11px; color: #ef4444; margin-top: 8px; display: none; }
    .w-demo { font-size: 10px; color: #b45309; background: #fff7e6; border-radius: 8px;
      padding: 2px 8px; display: inline-block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="w-head">
      <div class="w-logo"></div>
      <span class="w-title">API 监控 · 小组件</span>
      <span class="w-time" id="wTime">--</span>
    </div>
    <div id="wDemo" class="w-demo" style="display:none">演示数据</div>
    <div>
      <span class="w-provider" id="wProvider">--</span><span class="w-model" id="wModel"></span>
    </div>
    <div class="w-remaining" id="wRemaining">--</div>
    <div class="w-remaining-label" id="wRemainingLabel">剩余额度</div>
    <div class="w-rows">
      <div class="w-row">
        <span class="w-row-label">已消耗 Token</span>
        <span class="w-row-value" id="wUsed">--</span>
      </div>
      <div class="w-row">
        <span class="w-row-label">调用次数</span>
        <span class="w-row-value" id="wCount">--</span>
      </div>
    </div>
    <div class="w-error" id="wError"></div>
    <div class="w-foot">
      <span class="w-note">每分钟自动刷新</span>
      <div class="w-actions">
        <button class="w-btn" id="wOpen">打开应用</button>
        <button class="w-btn primary" id="wRefresh">刷新</button>
      </div>
    </div>
  </div>

  <script src="./js/store.js"></script>
  <script src="./js/providers.js"></script>
  <script src="./js/widget.js"></script>
</body>
</html>
